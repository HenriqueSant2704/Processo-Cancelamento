# Publicação no Render (Blueprint). No painel do Render: New > Blueprint > escolha este repositório.
# O banco fica no Neon: cole a "connection string" do Neon em DATABASE_URL quando o Render pedir.
services:
  - type: web
    name: temis-cobranca
    runtime: node
    plan: free
    region: ohio                # escolha a região mais perto da região do seu banco no Neon
    buildCommand: npm ci --omit=dev
    startCommand: npm run web
    healthCheckPath: /saude
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Sao_Paulo
      - key: SGP_MODO
        value: api
      - key: SGP_URA_CLIENTES_URL
        sync: false              # segredo: endereço da rota URA de clientes do SGP
      - key: SGP_APP
        sync: false
      - key: SGP_TOKEN
        sync: false
      - key: SGP_HORA_SINCRONIZACAO
        value: "7"
      - key: DATABASE_URL
        sync: false              # segredo: o Render pede o valor na criação (não fica no git)
