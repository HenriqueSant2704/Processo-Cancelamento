<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Têmis · Cobrança</title>
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="app">
    <!-- Trilho lateral -->
    <nav class="trilho" aria-label="Menu">
      <img class="trilho-logo" src="icone.svg" alt="Têmis" width="34" height="34">
      <button class="trilho-item ativo" data-vista="hoje" title="Fila de hoje" aria-label="Fila de hoje">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
        <span class="trilho-badge" id="badge-hoje"></span>
      </button>
      <button class="trilho-item" data-vista="clientes" title="Todos os clientes" aria-label="Todos os clientes">
        <svg viewBox="0 0 24 24"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20M10 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM20 20v-1.5a3.5 3.5 0 0 0-2.5-3.35M15.5 4.15a3.5 3.5 0 0 1 0 6.7"/></svg>
      </button>
      <div class="trilho-fim">
        <button class="trilho-item" id="botao-tema" title="Tema claro ou escuro" aria-label="Alternar tema">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <button class="avatar-usuario" id="botao-usuario" title="Usuário" aria-label="Usuário"><span id="usuario-iniciais">?</span></button>
      </div>
    </nav>

    <div class="principal">
      <!-- Barra superior -->
      <header class="barra">
        <div class="barra-titulo">
          <span class="sobretitulo" id="data-extenso"></span>
          <h1 id="saudacao">Fila de hoje</h1>
        </div>
        <div class="barra-acoes">
          <label class="busca">
            <svg viewBox="0 0 24 24"><path d="m20 20-4.2-4.2M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z"/></svg>
            <input type="search" id="busca" placeholder="Buscar cliente ou contrato" autocomplete="off">
            <kbd>/</kbd>
          </label>
          <label class="simular" id="simular" hidden title="Só no modo demonstração">
            <span>Dia</span>
            <input type="date" id="campo-data">
          </label>
          <div class="sync" id="sync">
            <i class="sync-luz" id="sync-luz"></i>
            <span class="sync-texto" id="sync-texto">SGP</span>
            <button class="botao-sync" id="botao-sincronizar" title="Buscar suspensos no SGP agora">
              <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/></svg>
              <span>Sincronizar</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Vista: fila de hoje -->
      <section id="vista-hoje" class="vista">
        <div class="painel-topo">
          <div class="metricas" id="metricas"></div>
          <div class="funil" id="funil" aria-label="Clientes por etapa"></div>
        </div>

        <div class="mesa">
          <section class="fila" aria-label="Fila de trabalho">
            <div class="fila-cabeca">
              <div class="abas" id="abas" role="tablist"></div>
            </div>
            <div class="fila-lista" id="fila" role="listbox" aria-label="Clientes para atender hoje"></div>
            <div class="fila-rodape"><kbd>↑</kbd><kbd>↓</kbd> navegar <span class="sep">·</span> <kbd>/</kbd> buscar</div>
          </section>

          <section class="ficha" id="ficha" aria-live="polite"></section>
        </div>
      </section>

      <!-- Vista: todos os clientes -->
      <section id="vista-clientes" class="vista" hidden>
        <div class="clientes-topo">
          <div class="abas" id="abas-clientes"></div>
          <div class="funil compacto" id="funil-clientes"></div>
        </div>
        <div class="tabela-wrap">
          <table class="tabela">
            <thead>
              <tr><th>Cliente</th><th>Suspenso há</th><th>Etapa</th><th>Próxima ação</th><th>Situação</th></tr>
            </thead>
            <tbody id="tabela-clientes"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <!-- Decisão "regularizou?" -->
  <dialog class="janela" id="janela-decisao">
    <form method="dialog" id="form-decisao">
      <span class="sobretitulo" id="decisao-cliente"></span>
      <h3 id="decisao-pergunta"></h3>
      <div class="escolha">
        <label class="opcao sim"><input type="radio" name="resposta" value="sim" required><span>Sim, regularizou</span></label>
        <label class="opcao nao"><input type="radio" name="resposta" value="nao" required><span>Não regularizou</span></label>
      </div>
      <label class="campo">
        <span id="decisao-rotulo">O que foi feito? Por quê?</span>
        <textarea name="observacao" rows="3" required placeholder="Ex.: Pagou via PIX hoje às 10h / Não atendeu as ligações"></textarea>
      </label>
      <p class="efeito" id="decisao-efeito"></p>
      <div class="janela-acoes">
        <button type="button" class="botao fantasma" id="decisao-cancelar">Cancelar</button>
        <button type="submit" class="botao primario">Registrar</button>
      </div>
    </form>
  </dialog>

  <!-- Nome (modo sem login) -->
  <dialog class="janela" id="janela-usuario">
    <form method="dialog" id="form-usuario">
      <h3>Quem está usando?</h3>
      <p class="texto-suave">Seu nome fica registrado em cada tarefa que você concluir.</p>
      <label class="campo">
        <span>Seu nome</span>
        <input name="nome" required maxlength="60" autocomplete="name" placeholder="Ex.: Jessica">
      </label>
      <div class="janela-acoes">
        <button type="submit" class="botao primario">Entrar</button>
      </div>
    </form>
  </dialog>

  <!-- Trocar senha -->
  <dialog class="janela" id="janela-senha">
    <form method="dialog" id="form-senha">
      <h3>Trocar senha</h3>
      <label class="campo">
        <span>Senha atual</span>
        <input name="senhaAtual" type="password" autocomplete="current-password" required>
      </label>
      <label class="campo">
        <span>Nova senha (mínimo 8 caracteres)</span>
        <input name="novaSenha" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label class="campo">
        <span>Confirme a nova senha</span>
        <input name="confirmar" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <div class="janela-acoes">
        <button type="button" class="botao fantasma" id="senha-cancelar">Cancelar</button>
        <button type="submit" class="botao primario">Salvar</button>
      </div>
    </form>
  </dialog>

  <div class="avisos" id="avisos" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
